services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # environment:
    #   # Inside Docker, localhost = the container itself.
    #   # host.docker.internal resolves to your Windows host machine where your DB is running.
    #   - DATABASE_URL=postgresql+asyncpg://whatsappecomm:whatsappecomm123@host.docker.internal:5436/whatsapp_ecomm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
